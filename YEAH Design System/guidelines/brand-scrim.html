<!-- @dsCard group="Brand" viewport="700x170" name="Protection gradient" subtitle="Bottom scrim for type over imagery; capsules elsewhere" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--surface-page);color:var(--text-body);font-family:var(--font-body);box-sizing:border-box}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}.lbl{font-family:var(--font-body);font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}.mono{font-family:var(--font-mono);font-size:11px}</style>
</head><body><div style="display:flex;gap:0;height:170px">
<div style="flex:1;position:relative;background:var(--yeah-black);overflow:hidden">
<div style="position:absolute;inset:0;background:repeating-linear-gradient(45deg,#242424 0 12px,#141414 12px 24px)"></div>
<div style="position:absolute;inset:0;background:var(--scrim-bottom)"></div>
<div style="position:absolute;left:16px;bottom:14px;color:#fff;font-family:var(--font-display);font-weight:600;font-size:22px">Type on imagery</div></div>
<div style="flex:1;position:relative;background:var(--yeah-black);overflow:hidden;border-left:2px solid var(--yeah-black)">
<div style="position:absolute;inset:0;background:repeating-linear-gradient(45deg,#242424 0 12px,#141414 12px 24px)"></div>
<div style="position:absolute;left:16px;bottom:14px;background:var(--yeah-yellow);color:var(--yeah-black);border:2px solid var(--yeah-black);padding:6px 14px;font-family:var(--font-display);font-weight:600;font-size:20px">Capsule instead</div></div>
</div></body></html>
