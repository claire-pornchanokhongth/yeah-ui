<!-- @dsCard group="Brand" viewport="700x160" name="Block shadow" subtitle="Hard offsets only — no soft ambient shadows" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--surface-page);color:var(--text-body);font-family:var(--font-body);box-sizing:border-box}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}.lbl{font-family:var(--font-body);font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}.mono{font-family:var(--font-mono);font-size:11px}</style>
</head><body><div style="padding:20px 18px;display:flex;gap:22px;align-items:center">
<div style="display:flex;flex-direction:column;gap:10px;align-items:flex-start"><div style="width:88px;height:60px;background:var(--yeah-white);border:2px solid var(--yeah-black);box-shadow:2px 2px 0 var(--yeah-black)"></div><span class="mono" style="color:var(--text-muted);font-size:9px">--shadow-block-sm</span></div><div style="display:flex;flex-direction:column;gap:10px;align-items:flex-start"><div style="width:88px;height:60px;background:var(--yeah-white);border:2px solid var(--yeah-black);box-shadow:4px 4px 0 var(--yeah-black)"></div><span class="mono" style="color:var(--text-muted);font-size:9px">--shadow-block</span></div><div style="display:flex;flex-direction:column;gap:10px;align-items:flex-start"><div style="width:88px;height:60px;background:var(--yeah-white);border:2px solid var(--yeah-black);box-shadow:8px 8px 0 var(--yeah-black)"></div><span class="mono" style="color:var(--text-muted);font-size:9px">--shadow-block-lg</span></div><div style="display:flex;flex-direction:column;gap:10px;align-items:flex-start"><div style="width:88px;height:60px;background:var(--yeah-white);border:2px solid var(--yeah-black);box-shadow:4px 4px 0 var(--yeah-pink)"></div><span class="mono" style="color:var(--text-muted);font-size:9px">--shadow-block-pink</span></div><div style="display:flex;flex-direction:column;gap:10px;align-items:flex-start"><div style="width:88px;height:60px;background:var(--yeah-white);border:2px solid var(--yeah-black);box-shadow:4px 4px 0 var(--yeah-yellow)"></div><span class="mono" style="color:var(--text-muted);font-size:9px">--shadow-block-yellow</span></div>
</div></body></html>
