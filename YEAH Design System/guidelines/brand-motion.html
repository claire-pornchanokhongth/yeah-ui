<!-- @dsCard group="Brand" viewport="700x140" name="Motion" subtitle="80 / 140 / 220 / 400ms · ease-out, no bounce" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--surface-page);color:var(--text-body);font-family:var(--font-body);box-sizing:border-box}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}.lbl{font-family:var(--font-body);font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}.mono{font-family:var(--font-mono);font-size:11px}</style>
</head><body><div style="padding:20px;display:flex;flex-direction:column;gap:14px;font-family:var(--font-body)">
<div style="display:flex;align-items:center;gap:14px"><span class="mono" style="width:72px;flex:none">instant</span><span class="mono" style="width:60px;flex:none;color:var(--text-accent)">80ms</span><div style="height:8px;background:var(--yeah-pink);border:2px solid var(--yeah-black);width:82px"></div><span style="font-size:12px;color:var(--text-muted)">micro state flips</span></div><div style="display:flex;align-items:center;gap:14px"><span class="mono" style="width:72px;flex:none">fast</span><span class="mono" style="width:60px;flex:none;color:var(--text-accent)">140ms</span><div style="height:8px;background:var(--yeah-pink);border:2px solid var(--yeah-black);width:121px"></div><span style="font-size:12px;color:var(--text-muted)">hover, press, toggles</span></div><div style="display:flex;align-items:center;gap:14px"><span class="mono" style="width:72px;flex:none">base</span><span class="mono" style="width:60px;flex:none;color:var(--text-accent)">220ms</span><div style="height:8px;background:var(--yeah-pink);border:2px solid var(--yeah-black);width:173px"></div><span style="font-size:12px;color:var(--text-muted)">panels, tabs, toasts</span></div><div style="display:flex;align-items:center;gap:14px"><span class="mono" style="width:72px;flex:none">slow</span><span class="mono" style="width:60px;flex:none;color:var(--text-accent)">400ms</span><div style="height:8px;background:var(--yeah-pink);border:2px solid var(--yeah-black);width:290px"></div><span style="font-size:12px;color:var(--text-muted)">page and hero reveals</span></div>
<span class="mono" style="color:var(--text-muted)">--ease-out: cubic-bezier(.2,.8,.2,1)</span></div></body></html>
