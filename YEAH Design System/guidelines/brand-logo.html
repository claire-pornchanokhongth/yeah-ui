<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">

</head><body><div style="display:grid;grid-template-columns:1fr 1fr;gap:0;height:200px">
<div style="background:var(--yeah-white);display:flex;align-items:center;justify-content:center;padding:28px"><img src="../assets/logo-lockup.png" alt="YEAH" style="max-width:100%;height:auto;max-height:110px"></div>
<div style="background:var(--yeah-black);display:flex;align-items:center;justify-content:center;padding:28px"><img src="../assets/logo-lockup-knockout.png" alt="YEAH" style="max-width:100%;height:auto;max-height:110px"></div>
