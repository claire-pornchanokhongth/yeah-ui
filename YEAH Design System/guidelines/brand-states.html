<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--surface-page);color:var(--text-body);font-family:var(--font-body);box-sizing:border-box}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}.lbl{font-family:var(--font-body);font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}.mono{font-family:var(--font-mono);font-size:11px}</style>
</head><body><div style="padding:20px;display:flex;gap:26px;align-items:center;font-family:var(--font-body)">
<div style="display:flex;flex-direction:column;gap:12px;align-items:center"><div style="height:44px;padding:0 22px;display:flex;align-items:center;background:var(--yeah-pink);color:#fff;font-weight:600;font-size:14px;border:2px solid var(--yeah-black);border-radius:999px;transform:translate(0,0);box-shadow:4px 4px 0 var(--yeah-black);opacity:1">Join</div><span class="mono" style="color:var(--text-muted)">Rest</span></div><div style="display:flex;flex-direction:column;gap:12px;align-items:center"><div style="height:44px;padding:0 22px;display:flex;align-items:center;background:var(--yeah-pink);color:#fff;font-weight:600;font-size:14px;border:2px solid var(--yeah-black);border-radius:999px;transform:translate(-2px,-2px);box-shadow:8px 8px 0 var(--yeah-black);opacity:1">Join</div><span class="mono" style="color:var(--text-muted)">Hover</span></div><div style="display:flex;flex-direction:column;gap:12px;align-items:center"><div style="height:44px;padding:0 22px;display:flex;align-items:center;background:var(--yeah-pink);color:#fff;font-weight:600;font-size:14px;border:2px solid var(--yeah-black);border-radius:999px;transform:translate(2px,2px);box-shadow:none;opacity:1">Join</div><span class="mono" style="color:var(--text-muted)">Press</span></div><div style="display:flex;flex-direction:column;gap:12px;align-items:center"><div style="height:44px;padding:0 22px;display:flex;align-items:center;background:var(--yeah-pink);color:#fff;font-weight:600;font-size:14px;border:2px solid var(--yeah-black);border-radius:999px;transform:translate(0,0);box-shadow:0 0 0 3px var(--yeah-yellow);opacity:1">Join</div><span class="mono" style="color:var(--text-muted)">Focus</span></div><div style="display:flex;flex-direction:column;gap:12px;align-items:center"><div style="height:44px;padding:0 22px;display:flex;align-items:center;background:var(--yeah-pink);color:#fff;font-weight:600;font-size:14px;border:2px solid var(--yeah-black);border-radius:999px;transform:translate(0,0);box-shadow:4px 4px 0 var(--yeah-black);opacity:0.45">Join</div><span class="mono" style="color:var(--text-muted)">Disabled</span></div>
</div></body></html>
