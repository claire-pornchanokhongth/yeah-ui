<!-- @dsCard group="Spacing" viewport="700x180" name="Spacing in use" subtitle="Card padding 24, stack gap 12, section gap 48" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--surface-page);color:var(--text-body);font-family:var(--font-body);box-sizing:border-box}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}.lbl{font-family:var(--font-body);font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}.mono{font-family:var(--font-mono);font-size:11px}</style>
</head><body><div style="padding:16px 18px;display:flex;gap:48px;align-items:flex-start">
<div style="background:var(--surface-card);border:2px solid var(--yeah-black);box-shadow:var(--shadow-block);padding:24px;display:flex;flex-direction:column;gap:12px;width:260px">
<span class="lbl" style="color:var(--text-accent)">Upcoming</span>
<strong style="font-family:var(--font-display);font-size:25px;line-height:1.2">Pitch Night 04</strong>
<span style="font-size:14px;color:var(--text-muted)">Thu 12 Sep · 18:00</span></div>
<div style="display:flex;flex-direction:column;gap:6px;padding-top:8px">
<span class="mono">padding: var(--space-6) &nbsp;/* 24 */</span>
<span class="mono">gap: var(--space-3) &nbsp;/* 12 */</span>
<span class="mono">section gap: var(--space-12) &nbsp;/* 48 */</span>
<span class="mono">--container-max: 1200px</span></div></div></body></html>
