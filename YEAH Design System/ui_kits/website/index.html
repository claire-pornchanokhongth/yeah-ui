<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>YEAH — Young Entrepreneur Assembly Hub</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="./data.js"></script>
<style>html,body{margin:0}body{background:var(--surface-page);color:var(--text-body);font-family:var(--font-body);-webkit-font-smoothing:antialiased}
a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}*{box-sizing:border-box}</style>
</head><body><div id="root"></div>
<script type="text/babel" src="./SiteChrome.jsx"></script>
<script type="text/babel" src="./HomeScreen.jsx"></script>
<script type="text/babel" src="./EventsScreen.jsx"></script>
<script type="text/babel" src="./EventDetailScreen.jsx"></script>
<script type="text/babel" src="./MembersScreen.jsx"></script>
<script type="text/babel" src="./JoinScreen.jsx"></script>
<script type="text/babel">
function App(){
  const [route,setRoute]=React.useState('home');
  const [ev,setEv]=React.useState(null);
  const go=(r,payload)=>{setRoute(r);if(payload)setEv(payload);window.scrollTo(0,0)};
  return (<div style={{display:'flex',flexDirection:'column',minHeight:'100vh'}}>
    <SiteHeader route={route==='event'?'events':route} go={go}/>
    <main style={{flex:1}}>
      {route==='home'?<HomeScreen go={go}/>
      :route==='events'?<EventsScreen go={go}/>
      :route==='event'?<EventDetailScreen ev={ev} go={go}/>
      :route==='members'?<MembersScreen go={go}/>
      :<JoinScreen go={go}/>}
    </main>
    <SiteFooter go={go}/>
  </div>);
}
const mount=()=>ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
if(window.SiteHeader&&window.JoinScreen)mount();else setTimeout(mount,300);
</script></body></html>
