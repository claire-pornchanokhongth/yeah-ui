<!-- @dsCard group="Colors" viewport="700x150" name="Semantic surfaces" subtitle="--surface-* aliases used by every component" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--surface-page);color:var(--text-body);font-family:var(--font-body);box-sizing:border-box}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}.lbl{font-family:var(--font-body);font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}.mono{font-family:var(--font-mono);font-size:11px}</style>
</head><body><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:12px;height:150px;box-sizing:border-box">
<div style="background:var(--surface-page);color:var(--text-heading);border:2px solid var(--yeah-black);display:flex;align-items:flex-end;padding:10px"><span class="mono">--surface-page</span></div><div style="background:var(--surface-card);color:var(--text-heading);border:2px solid var(--yeah-black);display:flex;align-items:flex-end;padding:10px"><span class="mono">--surface-card</span></div><div style="background:var(--surface-sunken);color:var(--text-heading);border:2px solid var(--yeah-black);display:flex;align-items:flex-end;padding:10px"><span class="mono">--surface-sunken</span></div><div style="background:var(--surface-accent);color:var(--text-on-pink);border:2px solid var(--yeah-black);display:flex;align-items:flex-end;padding:10px"><span class="mono">--surface-accent</span></div><div style="background:var(--surface-accent-alt);color:var(--text-on-yellow);border:2px solid var(--yeah-black);display:flex;align-items:flex-end;padding:10px"><span class="mono">--surface-accent-alt</span></div>
</div></body></html>
