<!-- @dsCard group="Colors" viewport="700x120" name="Status colours" subtitle="Brand hues do double duty; one green is borrowed" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--surface-page);color:var(--text-body);font-family:var(--font-body);box-sizing:border-box}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}.lbl{font-family:var(--font-body);font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}.mono{font-family:var(--font-mono);font-size:11px}</style>
</head><body><div style="display:flex;gap:8px;padding:12px;height:120px;box-sizing:border-box">
<div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;background:#010101;color:#fff;padding:12px;border:2px solid var(--yeah-black);gap:2px"><span class="lbl">info</span><span class="mono">#010101</span></div><div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;background:#00A46B;color:#fff;padding:12px;border:2px solid var(--yeah-black);gap:2px"><span class="lbl">success</span><span class="mono">#00A46B</span></div><div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;background:#FED732;color:#010101;padding:12px;border:2px solid var(--yeah-black);gap:2px"><span class="lbl">warning</span><span class="mono">#FED732</span></div><div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;background:#FE0074;color:#fff;padding:12px;border:2px solid var(--yeah-black);gap:2px"><span class="lbl">danger</span><span class="mono">#FE0074</span></div>
</div></body></html>
