<!-- @dsCard group="Colors" viewport="700x160" name="Semantic text" subtitle="--text-* on light and dark ground" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--surface-page);color:var(--text-body);font-family:var(--font-body);box-sizing:border-box}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}.lbl{font-family:var(--font-body);font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}.mono{font-family:var(--font-mono);font-size:11px}</style>
</head><body><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px;height:160px;box-sizing:border-box">
<div style="background:var(--surface-page);border:2px solid var(--yeah-black);padding:12px;display:flex;flex-direction:column;gap:4px;justify-content:center">
<span style="color:var(--text-heading);font-family:var(--font-display);font-weight:600;font-size:20px">--text-heading</span>
<span style="color:var(--text-body);font-size:14px">--text-body</span>
<span style="color:var(--text-muted);font-size:14px">--text-muted</span>
<span style="color:var(--text-accent);font-size:14px;font-weight:600">--text-accent</span></div>
<div style="background:var(--surface-page-invert);border:2px solid var(--yeah-black);padding:12px;display:flex;flex-direction:column;gap:4px;justify-content:center">
<span style="color:var(--text-on-dark);font-family:var(--font-display);font-weight:600;font-size:20px">--text-on-dark</span>
<span style="color:var(--yeah-yellow);font-size:14px;font-weight:600">--yeah-yellow on black</span>
<span style="color:var(--yeah-pink-300);font-size:14px;font-weight:600">--yeah-pink-300 on black</span>
<span style="color:var(--neutral-400);font-size:14px">--neutral-400</span></div>
</div></body></html>
